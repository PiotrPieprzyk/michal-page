name: Deploy

on:
  push:
    branches: [main]
  # Sanity webhook (publish) -> POST /repos/:owner/:repo/dispatches {"event_type":"sanity-publish"}
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

# A newer publish supersedes a running build.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  id-token: write # AWS OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No `environment:` here: it would change the OIDC subject the AWS role trusts
    # (repo:PiotrPieprzyk/michal-page:ref:refs/heads/main).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Deploy (SST)
        run: npx sst deploy --stage production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
